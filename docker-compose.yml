services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autonomyx
      POSTGRES_PASSWORD: autonomyx
      POSTGRES_DB: autonomyx
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    environment:
      DATABASE_URL: postgresql://autonomyx:autonomyx@postgres:5432/autonomyx
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-change-me
      DEBUG: "true"
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  claude-coder:
    build: ./services/claude-coder
    env_file:
      - .env
    environment:
      CODING_SPECIALIST_MODEL: ${CODING_SPECIALIST_MODEL:-}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./:/workspace
    ports:
      - "18080:8080"
    profiles: ["coding"]

  memory-service:
    build: ./services/memory-service
    env_file:
      - .env
    environment:
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
    volumes:
      - ./:/workspace
    ports:
      - "18090:8090"
    profiles: ["coding"]

volumes:
  pgdata:
