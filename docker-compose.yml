services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autonomyx
      POSTGRES_PASSWORD: autonomyx
      POSTGRES_DB: autonomyx
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    environment:
      DATABASE_URL: postgresql://autonomyx:autonomyx@postgres:5432/autonomyx
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-change-me
      DEBUG: "true"
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  # LangFlow for Visual Agent Orchestration
  langflow:
    image: langflowai/langflow:1.9.0
    environment:
      LANGFLOW_PORT: 7860
      LANGFLOW_SUPERUSER: admin
      LANGFLOW_SUPERUSER_PASSWORD: admin123
      LANGFLOW_DATABASE_URL: postgresql://autonomyx:autonomyx@postgres:5432/langflow
      LANGFLOW_SECRET_KEY: dev-langflow-secret-change-me
      LANGFLOW_CUSTOM_COMPONENTS_DIR: /home/langflow/user_config
    ports:
      - "17860:7860"
    volumes:
      - ./langflow_components:/home/langflow/user_config/custom_components/decide:ro
    depends_on:
      postgres:
        condition: service_healthy

  claude-coder:
    build: ./services/claude-coder
    env_file:
      - .env
    environment:
      CODING_SPECIALIST_MODEL: ${CODING_SPECIALIST_MODEL:-}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./:/workspace
    ports:
      - "18080:8080"
    profiles: ["coding"]

  memory-service:
    build: ./services/memory-service
    env_file:
      - .env
    environment:
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
    volumes:
      - ./:/workspace
    ports:
      - "18090:8090"
    profiles: ["coding"]

  # ─── MCP Fleet ────────────────────────────────────────────────────────────
  # Opt-in via `docker compose --profile mcp up`. Each service wraps one
  # external platform as MCP tools for the LangGraph orchestrator.
  # Ports 3101–3112 on platform_internal network (prod); host-mapped for local dev.
  # See services/_mcp_template/ for the base pattern.

  liferay-mcp:
    build: ./services/liferay-mcp
    env_file:
      - .env
    environment:
      MCP_SERVICE_NAME: liferay
      MCP_BIND_PORT: "3101"
      MCP_BASE_URL: ${LIFERAY_BASE_URL:-}
      LIFERAY_USER: ${LIFERAY_USER:-}
      LIFERAY_PASSWORD: ${LIFERAY_PASSWORD:-}
    ports:
      - "3101:3101"
    profiles: ["mcp"]

  # Additional MCPs (Tasks #6-14, #21, #22) — add as services/<name>-mcp/ lands:
  # wordpress-mcp   → port 3102
  # ghost-mcp       → port 3103   (existing at /Users/apple/mcpservers/ghost-mcp-server)
  # postiz-mcp      → port 3104
  # baserow-mcp     → port 3105
  # webstudio-mcp   → port 3106
  # teachable-mcp   → port 3107
  # matomo-mcp      → port 3108
  # mercur-mcp      → port 3109
  # n8n-mcp         → port 3110
  # hostinger-mcp   → port 3111   (existing at /Users/apple/mcpservers/hostinger-mcp)
  # logto-mcp       → port 3112   (existing at /Users/apple/mcpservers/logto-mcp-server)

volumes:
  pgdata:
