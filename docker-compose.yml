services:
  claude-coder:
    build: ./services/claude-coder
    env_file:
      - .env
    environment:
      CODING_SPECIALIST_MODEL: ${CODING_SPECIALIST_MODEL}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    volumes:
      - ./:/workspace
    ports:
      - "18080:8080"

  memory-service:
    build: ./services/memory-service
    env_file:
      - .env
    environment:
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
    volumes:
      - ./:/workspace
    ports:
      - "18090:8090"
